name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, unit, integration)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: bnpl
          MYSQL_USER: bnpl
          MYSQL_PASSWORD: bnplpw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpw"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
          --health-start-period=20s
    env:
      # multiStatements lets the test harness apply the migration files; the
      # running services use a DSN without it.
      BNPL_TEST_DSN: "bnpl:bnplpw@tcp(127.0.0.1:3306)/bnpl?parseTime=true&loc=UTC&multiStatements=true&charset=utf8mb4&collation=utf8mb4_0900_ai_ci"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Allow append-only guard triggers under binary logging
        run: |
          MYSQL_ID=$(docker ps --filter ancestor=mysql:8.0 --format '{{.ID}}' | head -n1)
          docker exec "$MYSQL_ID" mysql -uroot -prootpw \
            -e "SET GLOBAL log_bin_trust_function_creators = 1;"

      - name: Build
        working-directory: backend
        run: go build ./...

      - name: Vet (including integration tag)
        working-directory: backend
        run: go vet -tags=integration ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.15.0
          working-directory: backend

      - name: Unit tests (race)
        working-directory: backend
        run: go test -race ./internal/...

      - name: Integration tests (race, real MySQL)
        working-directory: backend
        run: go test -race -count=1 -tags=integration ./tests/...

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright checkout)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: bnpl
          MYSQL_USER: bnpl
          MYSQL_PASSWORD: bnplpw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpw"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
          --health-start-period=20s
    env:
      E2E_DB_DSN: "bnpl:bnplpw@tcp(127.0.0.1:3306)/bnpl?parseTime=true&loc=UTC&charset=utf8mb4&collation=utf8mb4_0900_ai_ci"
      MIGRATE_DSN: "bnpl:bnplpw@tcp(127.0.0.1:3306)/bnpl?parseTime=true&loc=UTC&multiStatements=true&charset=utf8mb4&collation=utf8mb4_0900_ai_ci"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Allow append-only guard triggers under binary logging
        run: |
          MYSQL_ID=$(docker ps --filter ancestor=mysql:8.0 --format '{{.ID}}' | head -n1)
          docker exec "$MYSQL_ID" mysql -uroot -prootpw \
            -e "SET GLOBAL log_bin_trust_function_creators = 1;"

      - name: Apply migrations
        run: |
          go install -tags 'mysql' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          make migrate-up

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
