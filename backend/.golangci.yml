version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - revive
    - unconvert
    - wastedassign
  exclusions:
    generated: lax
    rules:
      # sqlc output is machine-generated; do not lint it.
      - path: internal/db/sqlc/
        linters:
          - revive
          - gocritic
          - errcheck
          - staticcheck
          - unused
          - misspell
          - bodyclose
          - unconvert
          - wastedassign

formatters:
  enable:
    - gofmt
    - goimports
